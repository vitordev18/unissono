name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes do app
        run: npm run test:app -- --ci

  rls:
    name: Testes de RLS (Supabase)
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Sem credenciais configuradas, os testes de RLS são pulados em vez de
      # falhar: um fork não tem acesso aos secrets do repositório.
      - name: Verificar credenciais
        id: credenciais
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "disponivel=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem credenciais do Supabase — testes de RLS ignorados."
          else
            echo "disponivel=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Testes de RLS
        if: steps.credenciais.outputs.disponivel == 'true'
        run: npm run test:rls -- --ci

  bundle:
    name: Bundle do app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Typecheck e testes não provam que o app empacota: erros de Metro,
      # NativeWind ou rota só aparecem no bundle.
      - name: Empacotar para Android
        run: npx expo export --platform android --output-dir "${{ runner.temp }}/bundle"
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
